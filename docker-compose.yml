services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fluora}
      POSTGRES_USER: ${POSTGRES_USER:-fluora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a local password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - fluora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-fluora}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fluora}?schema=public"
      PORT: "4000"
      GOOGLE_CLIENT_IDS: "${GOOGLE_CLIENT_IDS:-}"
      TUTOR_PROVIDER: "${TUTOR_PROVIDER:-local}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  fluora-postgres:
